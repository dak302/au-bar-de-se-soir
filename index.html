<style>

.btn.full{width:100%}

.box{margin:0 24px;background:#fff;border-radius:20px;padding:2px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--soft)}

details{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

.actions{display:flex;gap:10px;margin-top:26px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#FBF8F3;padding:12px 18px;border-radius:14px;font-size:14px;transition:transform 400ms ease,opacity 400ms ease;pointer-events:none;max-width:86vw;text-align:center}

.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* Verre 3D */
.glass-slot{position:relative;height:230px;margin:4px 0 -6px;touch-action:pan-y}
.glass-canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity 500ms var(--ease);cursor:grab}
.glass-slot.ready .glass-canvas{opacity:1}
.glass-canvas:active{cursor:grabbing}
.no3d .glass-slot{display:none}

@media (prefers-reduced-motion:reduce){
  .rise{animation:fade 200ms ease forwards;transform:none;animation-delay:0ms}

  .drawer.on,.sheet.on{opacity:1}
  .shake{animation:none}
  .splash span{animation:none}
  .toast{transition:opacity 200ms ease}
}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-transparency:reduce){
  .top{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}

const byOrder = (a, b) => (Number(a.ordre) || 0) - (Number(b.ordre) || 0);
const clone = o => JSON.parse(JSON.stringify(o));

// Adresse d'une photo. Dans le Manager on lit directement GitHub (visible tout de suite).
function photoUrl(p){
  if (!p) return '';
  if (/^(https?:|data:)/.test(p)) return p;
  return admin ? `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${p}` : p;
}
function missing(c, ings){
  return (c.ingredients || []).filter(r => {
    if (r.indexOf('cat:') === 0){ const b = r.slice(4); return !ings.some(i => i.base === b && isOn(i.dispo)); }
    const i = ings.find(x => x.id === r); return !(i && isOn(i.dispo));
  });
}
function computePub(d){
  const visible = d.cocktails.filter(c => !missing(c, d.ingredients).length).sort(byOrder);
  const labels = {};
  visible.forEach(c => c.ingredients.forEach(r => {
    if (r.indexOf('cat:') === 0 || labels[r]) return;
    const i = d.ingredients.find(x => x.id === r);
    if (i) labels[r] = { fr: i.nom_fr, he: i.nom_he, en: i.nom_en };
  }));
  return { categories: d.categories.slice().sort(byOrder), aboutPhoto: (d.about || {}).photo || '', cocktails: visible, labels };
}
function computeAdmin(){
  const ings = db.ingredients.map(i => Object.assign({}, i, { dispo: isOn(i.dispo) }));
  return {
    ingredients: ings,
    cocktails: db.cocktails.slice().sort(byOrder).map(c => Object.assign({}, c, { manque: missing(c, ings) })),
    categories: db.categories.slice().sort(byOrder),
    aboutPhoto: (db.about || {}).photo || '',
    guestbook: gbCache
  };
}
async function loadPublic(){
  const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('data.json introuvable');
  db = await r.json(); return computePub(db);
}

/* ---------- GitHub (Manager) ---------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function gh(path, opts){
  opts = opts || {};
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, Object.assign({}, opts, { headers: {
    Authorization: 'Bearer ' + ghToken, Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json' } }));
  if (!r.ok){
    const j = await r.json().catch(() => ({}));
    const e = new Error(r.status === 401 ? 'Clé GitHub refusée ou expirée' : (j.message || 'GitHub ' + r.status));
    e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function loadAdminDb(){
  const j = await gh(`/contents/data.json?ref=${BRANCH}&t=${Date.now()}`);
  db = JSON.parse(b64dec(j.content)); dbSha = j.sha;
}
async function putDb(d, msg){
  const r = await gh('/contents/data.json', { method: 'PUT', body: JSON.stringify({
    message: msg, branch: BRANCH, sha: dbSha, content: b64enc(JSON.stringify(d, null, 2) + '\n') }) });
  dbSha = r.content.sha;
}
// Les modifications passent une par une, et se rejouent si GitHub a changé entre-temps.
let queue = Promise.resolve();
function mutate(fn, msg){
  const job = queue.then(async () => {
    let draft = clone(db), res = fn(draft);
    try { await putDb(draft, msg); }
    catch(e){
      if (e.status !== 409 && e.status !== 422) throw e;
      await loadAdminDb(); draft = clone(db); res = fn(draft); await putDb(draft, msg);
    }
    db = draft; pub = computePub(db); return res;
  });
  queue = job.catch(() => {});
  return job;
}
function newId(text){
  const base = String(text || 'x').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 24) || 'x';
  return base + '_' + Math.random().toString(36).slice(2, 6);
}
async function sha256(s){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- Livre d'or (Apps Script) ---------- */
async function gbCall(fn, ...args){
  if (!GB_URL) throw new Error("Livre d'or non relié");
  const r = await fetch(GB_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Erreur');
  return j.data;
}

/* ---------- Actions ---------- */
const OPS = {
  getPublicData: () => loadPublic(),
  getGuestbook: () => gbCall('getGuestbook'),
  addGuestMessage: (n, m) => gbCall('addGuestMessage', n, m),
  async getAdminData(){
    await loadAdminDb();
    try { gbCache = GB_URL ? await gbCall('getGuestbook') : []; } catch(e){ gbCache = []; }
    pub = computePub(db); return computeAdmin();
  },
  async setIngredientDispo(_, id, on){
    await mutate(d => { const i = d.ingredients.find(x => x.id === id); if (i) i.dispo = !!on; }, (on ? 'Dispo : ' : 'Plus dispo : ') + id);
    return computeAdmin();
  },
  async saveIngredient(_, o){
    const clean = { groupe: o.groupe || 'frais', base: o.groupe === 'alcool' ? (o.base || '') : '',
      nom_fr: String(o.nom_fr || '').trim(), nom_he: String(o.nom_he || '').trim(), nom_en: String(o.nom_en || '').trim(), dispo: !!o.dispo };
    if (!clean.nom_fr) throw new Error('Le nom est obligatoire');
    await mutate(d => { const ex = o.id && d.ingredients.find(x => x.id === o.id);
      if (ex) Object.assign(ex, clean); else d.ingredients.push(Object.assign({ id: newId(clean.nom_fr) }, clean)); }, 'Ingrédient : ' + clean.nom_fr);
    return computeAdmin();
  },
  async deleteIngredient(_, id){
    const usedBy = db.cocktails.filter(c => c.ingredients.indexOf(id) !== -1).map(c => c.nom);
    if (usedBy.length) return { ok: false, usedBy, data: computeAdmin() };
    await mutate(d => { d.ingredients = d.ingredients.filter(x => x.id !== id); }, 'Suppression ingrédient : ' + id);
    return { ok: true, data: computeAdmin() };
  },
  async saveCocktail(_, o){
    const clean = { nom: String(o.nom || '').trim(),
      categorie: db.categories.some(c => c.id === o.categorie) ? o.categorie : 'autres',
      style_fr: o.style_fr || '', style_he: o.style_he || '', style_en: o.style_en || '',
      phrase_fr: o.phrase_fr || '', phrase_he: o.phrase_he || '', phrase_en: o.phrase_en || '',
      ingredients: o.ingredients || [],
      couleur: /^#[0-9a-fA-F]{6}$/.test(o.couleur || '') ? o.couleur : '#D9A441' };
    if (!clean.nom) throw new Error('Le nom est obligatoire');
    if (!clean.ingredients.length) throw new Error('Ajoute au moins un ingrédient');
    const id = await mutate(d => {
      const ex = o.id && d.cocktails.find(x => x.id === o.id);
      if (ex){ Object.assign(ex, clean); return ex.id; }
      const nid = newId(clean.nom), max = d.cocktails.reduce((m, c) => Math.max(m, Number(c.ordre) || 0), 0);
      d.cocktails.push(Object.assign({ id: nid, photo: '', ordre: max + 1 }, clean)); return nid;
    }, 'Cocktail : ' + clean.nom);
    return { id, data: computeAdmin() };
  },
  async deleteCocktail(_, id){
    await mutate(d => { d.cocktails = d.cocktails.filter(x => x.id !== id); }, 'Suppression cocktail : ' + id);
    return computeAdmin();
  },
  async saveCategory(_, o){
    const clean = { nom_fr: String(o.nom_fr || '').trim(), nom_he: String(o.nom_he || '').trim(), nom_en: String(o.nom_en || '').trim() };
    if (!clean.nom_fr) throw new Error('Le nom est obligatoire');
    const id = await mutate(d => {
      const ex = o.id && d.categories.find(x => x.id === o.id);
      if (ex){ Object.assign(ex, clean); return ex.id; }
      const nid = newId(clean.nom_fr), max = d.categories.reduce((m, c) => Math.max(m, Number(c.ordre) || 0), 0);
      d.categories.push(Object.assign({ id: nid, photo: '', ordre: max + 1 }, clean)); return nid;
    }, 'Catégorie : ' + clean.nom_fr);
    return { id, data: computeAdmin() };
  },
  async deleteCategory(_, id){
    const usedBy = db.cocktails.filter(c => c.categorie === id).map(c => c.nom)
      .concat(db.ingredients.filter(i => i.base === id).map(i => i.nom_fr));
    if (usedBy.length) return { ok: false, usedBy, data: computeAdmin() };
    await mutate(d => { d.categories = d.categories.filter(x => x.id !== id); }, 'Suppression catégorie : ' + id);
    return { ok: true, data: computeAdmin() };
  },
  async deleteGuestMessage(c, id){
    gbCache = await gbCall('deleteGuestMessage', c, id);
    return computeAdmin();
  },
  async uploadPhoto(_, kind, id, dataUrl){
    const path = `photos/${kind === 'categorie' ? (id === 'about' ? 'about' : 'cat_' + id) : id}_${Date.now().toString(36)}.jpg`;
    await gh('/contents/' + path, { method: 'PUT', body: JSON.stringify({
      message: 'Photo : ' + id, branch: BRANCH, content: String(dataUrl).split(',')[1] }) });
    let old = '';
    await mutate(d => {
      if (kind === 'categorie' && id === 'about'){ d.about = d.about || {}; old = d.about.photo; d.about.photo = path; return; }
      const row = (kind === 'categorie' ? d.categories : d.cocktails).find(x => x.id === id);
      if (row){ old = row.photo; row.photo = path; }
    }, 'Photo : ' + id);
    // Ancienne photo : supprimée du dépôt (sans bloquer si ça échoue).
    if (old && old !== path && !/^https?:/.test(old)){
      try { const f = await gh(`/contents/${old}?ref=${BRANCH}`);
        await gh('/contents/' + old, { method: 'DELETE', body: JSON.stringify({ message: 'Ancienne photo : ' + id, sha: f.sha, branch: BRANCH }) });
      } catch(e){}
    }
    return computeAdmin();
  }
};
function run(fn, ...args){
  try { return Promise.resolve(OPS[fn](...args)); } catch(e){ return Promise.reject(e); }
}

function catLabel(id){
  const c = (pub && pub.categories.find(x => x.id === id)) || (admin && admin.categories.find(x => x.id === id));
  return c ? pick(c, 'nom') : id;
}
function adminCatName(id){ const c = admin.categories.find(x => x.id === id); return c ? c.nom_fr : id; }
function adminBases(){ return admin.categories.filter(c => NOT_BASE.indexOf(c.id) === -1); }

function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');

/* ---------- Navigation ---------- */
function show(id, dir){
  const next = $('#v-' + id), cur = document.querySelector('.view.active');
  render(id);
  $('#backBtn').classList.toggle('hide', stack.length < 2);
  if (cur === next) return;
  const s = 32 * dir * (lang === 'he' ? -1 : 1);
  next.style.transition = 'none';
  next.style.transform = `translateX(${s}px)`;
  next.scrollTop = 0;
  void next.offsetWidth;
  next.style.transition = '';
  next.classList.add('active');
  next.style.transform = '';
  if (cur){
    cur.classList.remove('active');
    cur.style.transform = `translateX(${-s}px)`;
    setTimeout(() => { if (!cur.classList.contains('active')) { cur.style.transition='none'; cur.style.transform=''; void cur.offsetWidth; cur.style.transition=''; } }, 340);
  }
}
function go(id){ stack.push(id); show(id, 1); }
function goFromMenu(id){ closeMenu(); if (stack[stack.length-1] === id){ render(id); return; } stack = ['home']; go(id); }
function back(){ if (stack.length < 2) return; stack.pop(); show(stack[stack.length-1], -1); }
function goHome(){ stack = ['home']; show('home', -1); }

  window.__glassReq = { el, opts };

}

async function busy(btn, fn){
  if (!btn || btn.disabled) return;

/* ---------- Photos ---------- */
function resize(file){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const max = 1400, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = rej; im.src = url;
  });
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !pendingPhoto) return;
  const target = pendingPhoto; pendingPhoto = null;
  toast('Envoi de la photo…');
  try {
    const data = await resize(f);
    admin = await run('uploadPhoto', code, target.kind, target.id, data);
    await refreshPub();
    if (target.kind === 'cocktail' && edit && edit.type === 'ckt'){
      const c = admin.cocktails.find(x => x.id === target.id);
      if (c){ edit.obj.photo = c.photo; const th = $('#f_thumb'); if (th) th.style.backgroundImage = `url('${photoUrl(c.photo)}')`; }
    }
    renderManager(); toast('Photo enregistrée');
  } catch(err){ toast('Échec : ' + errMsg(err)); }
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'menu': openMenu(); break;
    case 'menu-close': closeMenu(); break;
    case 'back': back(); break;
    case 'acc':
      menuAcc = !menuAcc;
      el.parentElement.classList.toggle('open', menuAcc);
      el.nextElementSibling.classList.toggle('open', menuAcc);
      el.setAttribute('aria-expanded', menuAcc);
      break;
    case 'cat':
      curCat = id; closeMenu();
      if (stack[stack.length-1] === 'cat'){ render('cat'); $('#v-cat').scrollTop = 0; }
      else { stack = ['home']; go('cat'); }
      break;
    case 'surprise': goFromMenu('surprise'); break;
    case 'surprise-again': renderSurprise(); $('#v-surprise').scrollTop = 0; break;
    case 'guestbook': guestbook = null; goFromMenu('guestbook'); loadGuestbook(); break;
    case 'about': goFromMenu('about'); break;
    case 'lang': setLang(el.dataset.l); break;
    case 'manager': goFromMenu('manager'); break;
    case 'tab': tab = el.dataset.tab; renderManager(); break;
    case 'logout': admin = null; code = null; renderManager(); goHome(); break;
    case 'forget':
      if (!armed(el, 'Sûr ? Touche encore')) return;
      ghToken = ''; try { localStorage.removeItem('gh_token'); } catch(e){}
      admin = null; code = null; renderManager(); goHome(); toast('Clé oubliée'); break;

    case 'ing-toggle': {
      const i = admin.ingredients.find(x => x.id === id); if (!i) return;
      i.dispo = !i.dispo; el.setAttribute('aria-pressed', i.dispo);
      el.closest('.row').classList.toggle('off', !i.dispo);
      try { admin = await run('setIngredientDispo', code, id, i.dispo); refreshPub(); }
      catch(err){ toast('Échec : ' + errMsg(err)); i.dispo = !i.dispo; renderManager(); }
      break;
    }
    case 'ing-new': ingSheet(null); break;
    case 'ing-edit': ingSheet(admin.ingredients.find(x => x.id === id)); break;
    case 'sheet-switch': el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'); break;
    case 'ing-save': busy(el, async () => {
      const o = Object.assign({}, edit.obj, {
        nom_fr: $('#f_nom').value, groupe: $('#f_groupe').value, base: ($('#f_base') || {}).value || '',
        nom_he: $('#f_he').value, nom_en: $('#f_en').value, dispo: $('#f_dispo').getAttribute('aria-pressed') === 'true' });
      try { admin = await run('saveIngredient', code, o); await refreshPub(); closeSheet(); renderManager(); toast('Enregistré'); }
      catch(err){ sheetErr(errMsg(err)); }
    }); break;
    case 'ing-del':
      if (!armed(el)) return;
      busy(el, async () => {
        try {
          const r = await run('deleteIngredient', code, edit.obj.id); admin = r.data;
          if (!r.ok){ sheetErr('Utilisé dans : ' + r.usedBy.join(', ') + ". Retire-le de ces cocktails d'abord."); return; }
          await refreshPub(); closeSheet(); renderManager(); toast('Supprimé');
        } catch(err){ sheetErr(errMsg(err)); }
      }); break;

    case 'ckt-new': cktSheet(null); break;
    case 'ckt-edit': cktSheet(admin.cocktails.find(x => x.id === id)); break;
    case 'chip': {
      const r = el.dataset.r;
      if (edit.reqs.has(r)) edit.reqs.delete(r); else edit.reqs.add(r);
      el.setAttribute('aria-pressed', edit.reqs.has(r));
      break;
    }
    case 'ckt-save': busy(el, async () => {
      try {
        const isNew = !edit.obj.id;
        const r = await run('saveCocktail', code, cktFromForm()); admin = r.data; await refreshPub(); renderManager();
        if (isNew){ cktSheet(admin.cocktails.find(x => x.id === r.id)); toast('Enregistré, tu peux ajouter la photo'); }
        else { closeSheet(); toast('Enregistré'); }
      } catch(err){ sheetErr(errMsg(err)); }
    }); break;
    case 'ckt-del':
      if (!armed(el)) return;
      busy(el, async () => {
        try { admin = await run('deleteCocktail', code, edit.obj.id); await refreshPub(); closeSheet(); renderManager(); toast('Supprimé'); }
        catch(err){ sheetErr(errMsg(err)); }
      }); break;

    case 'cat-new': catSheet(null); break;
    case 'cat-edit': catSheet(admin.categories.find(x => x.id === id)); break;
    case 'cat-save': busy(el, async () => {
      const o = Object.assign({}, edit.obj, { nom_fr: $('#f_nom').value, nom_he: $('#f_he').value, nom_en: $('#f_en').value });
      try { const r = await run('saveCategory', code, o); admin = r.data; await refreshPub(); closeSheet(); renderManager(); toast('Enregistré'); }
      catch(err){ sheetErr(errMsg(err)); }
    }); break;
    case 'cat-del':
      if (!armed(el)) return;
      busy(el, async () => {
        try {
          const r = await run('deleteCategory', code, edit.obj.id); admin = r.data;
          if (!r.ok){ sheetErr('Utilisée par : ' + r.usedBy.join(', ') + ". Change-les de catégorie d'abord."); return; }
          await refreshPub(); closeSheet(); renderManager(); toast('Supprimée');
        } catch(err){ sheetErr(errMsg(err)); }
      }); break;

    case 'gb-del':
      if (!armed(el, 'Sûr ?')) return;
      busy(el, async () => {
        try { admin = await run('deleteGuestMessage', code, id); renderManager(); toast('Message effacé'); }
        catch(err){ toast('Échec : ' + errMsg(err)); }
      }); break;

    case 'photo':
      if (el.dataset.kind === 'categorie'){ pendingPhoto = { kind:'categorie', id }; $('#file').click(); break; }
      if (!edit.obj.id){ sheetErr("Enregistre d'abord le cocktail, puis ajoute la photo."); break; }
      pendingPhoto = { kind:'cocktail', id: edit.obj.id }; $('#file').click();
      break;
    case 'sheet-close': closeSheet(); break;
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, btn = form.querySelector('button[type="submit"]');
  if (form.id === 'loginForm'){
    const input = $('#code');
    busy(btn, async () => {
      const err = $('#loginErr');
      try {
        if (await sha256(input.value.trim()) !== CODE_HASH){ err.textContent = 'Code incorrect'; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); input.value=''; return; }
        const keyInput = $('#ghkey');
        if (keyInput){
          const k = keyInput.value.trim();
          if (!k){ err.textContent = 'Colle ta clé GitHub'; return; }
          ghToken = k;
          const repo = await gh('');
          if (!repo.permissions || !repo.permissions.push){ ghToken = ''; err.textContent = "Cette clé ne peut pas modifier le dépôt"; return; }
          store.set('gh_token', k);
        }
        code = input.value.trim();
        admin = {}; // passe les photos en lecture directe GitHub
        admin = await run('getAdminData', code); tab = 'ing'; renderManager();
      } catch(e){
        admin = null;
        if (e.status === 401){ ghToken = ''; try { localStorage.removeItem('gh_token'); } catch(_){} renderManager(); $('#loginErr').textContent = 'Clé GitHub refusée ou expirée. Colle une nouvelle clé.'; return; }
        err.textContent = errMsg(e) || t('error');
      }
    });
  }
  if (form.id === 'gbForm'){
    const nom = $('#gb_nom').value, msg = $('#gb_msg').value.trim(), out = $('#gbErr');
    if (!msg){ out.className = 'err'; out.textContent = t('gbEmpty'); return; }
    busy(btn, async () => {
      try {
        guestbook = await run('addGuestMessage', nom, msg);
        $('#gb_nom').value = ''; $('#gb_msg').value = '';
        out.className = 'err ok'; out.textContent = t('thanks');
        renderGuestbookList($('#gbList'));
      } catch(err){ out.className = 'err'; out.textContent = t('error'); }
    });
  }
});

/* ---------- Gestes ---------- */
// Sur iPhone, :active (retour d'appui) ne s'allume que si la page écoute touchstart.
document.addEventListener('touchstart', () => {}, { passive: true });

// Glisser pour fermer : suit le doigt 1:1, se ferme sur un geste rapide (vitesse) ou au-delà d'un tiers,
// résiste en sens inverse (rubber-band), et revient sinon. Interruptible : on peut le rattraper.
function dragToClose(el, axis, isOpen, close){
  let s = null;
  const pos = t => axis === 'y' ? t.clientY : t.clientX;
  const other = t => axis === 'y' ? t.clientX : t.clientY;
  const set = d => { el.style.transform = axis === 'y' ? `translateY(${d}px)` : `translateX(${d}px)`; };
  const band = (o, dim) => -(Math.abs(o) * dim * .55) / (dim + .55 * Math.abs(o));
  el.addEventListener('touchstart', e => {
    if (!isOpen() || e.touches.length > 1 || e.target.closest('input,textarea,select')) return;
    const t = e.touches[0];
    s = { p0: pos(t), o0: other(t), active: false, hist: [], size: axis === 'y' ? el.offsetHeight : el.offsetWidth };
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!s) return;
    const t = e.touches[0], d = pos(t) - s.p0, od = other(t) - s.o0;
    if (!s.active){
      if (Math.abs(d) < 10 && Math.abs(od) < 10) return;                      // seuil avant de décider
      const along = Math.abs(d) > Math.abs(od);
      const atTop = axis === 'y' ? el.scrollTop <= 0 : true;
      if (!along || d < 0 || !atTop){ s = null; return; }                      // c'est un défilement
      s.active = true; s.p0 = pos(t); el.classList.add('dragging');
    }
    e.preventDefault();
    const dd = pos(t) - s.p0;
    set(dd >= 0 ? dd : band(dd, s.size));
    s.hist.push({ d: dd, t: e.timeStamp }); if (s.hist.length > 5) s.hist.shift();
  }, { passive: false });
  const end = () => {
    if (!s) return;
    const st = s; s = null;
    if (!st.active) return;
    el.classList.remove('dragging');
    const h = st.hist, last = h[h.length - 1] || { d: 0 }, first = h[0] || last;
    const v = (last.d - first.d) / Math.max(1, (last.t - first.t));          // px/ms
    el.style.transform = '';
    if (last.d > st.size / 3 || v > .11) close();                              // une pichenette suffit
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
}
dragToClose($('#sheet'), 'y', () => $('#sheet').classList.contains('on'), closeSheet);
dragToClose($('#drawer'), 'x', () => $('#drawer').classList.contains('on'), closeMenu);

})();
